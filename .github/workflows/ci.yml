name: CI

on:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install backend dependencies
      run: |
        cd backend
        pip install -e ".[dev]"

    - name: Format check
      run: |
        cd backend
        python -m ruff format --check

    - name: Lint
      run: |
        cd backend
        python -m ruff check

    - name: Run unit tests
      run: |
        cd backend
        python -m pytest tests/unit -v --cov=app --cov-report=term-missing

    - name: Create storage directories
      run: sudo mkdir -p /var/lib/ferry/{bundles,outputs,releases} /var/log/ferry && sudo chown -R 1000:1000 /var/lib/ferry /var/log/ferry

    - name: Bootstrap FERRY
      run: make ci

    - name: Run integration tests
      run: |
        docker compose exec -T backend \
          python -m pytest tests/integration -v --no-header -q

    - name: Apply rate limit override for acceptance tests
      run: docker compose -f docker-compose.yml -f docker-compose.playwright.yml up -d backend

    - name: Run acceptance test suite
      run: |
        cd frontend
        npm ci
        npx playwright install --with-deps chromium
        ADMIN_PASSWORD=$(grep ^ADMIN_PASSWORD= ../.env | sed 's/^ADMIN_PASSWORD=//') \
        MAINTAINER_EMAIL=maintainer@ferry.local \
        MAINTAINER_PASSWORD=maintainer \
        npx playwright test

    - name: Collect logs on failure
      if: failure()
      run: docker compose logs --tail=50

    - name: Tear down
      if: always()
      run: make ci-clean
