#cloud-config
---
# Refresh Ubuntu package metadata for the packages: section.
# We intentionally do not perform a full package upgrade during
# first boot. This VM is an FERRY appliance rather than a
# general-purpose server; unattended-upgrades provides ongoing
# security updates after provisioning.
package_update: true

packages:
  - git
  - curl
  - ca-certificates
  - gnupg
  - lsb-release
  - ufw
  - unattended-upgrades

users:
  - name: ferry
    sudo: ALL=(ALL) NOPASSWD:ALL
    shell: /bin/bash
    groups: docker
    lock_passwd: true
    ssh_authorized_keys: []

runcmd:
  # Set up Docker repository
  - install -m 0755 -d /etc/apt/keyrings
  - curl -fsSL https://download.docker.com/linux/ubuntu/gpg | gpg --dearmor -o /etc/apt/keyrings/docker.gpg
  - |
    echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu $(lsb_release -cs) stable" | tee /etc/apt/sources.list.d/docker.list > /dev/null

  # Install Docker Engine and Docker Compose
  - apt-get update
  - apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin

  # Enable and start Docker
  - systemctl enable docker
  - systemctl start docker

  # Enable unattended security upgrades
  - dpkg-reconfigure --priority=low unattended-upgrades -f noninteractive

  # Configure UFW
  - ufw default deny incoming
  - ufw default allow outgoing
  - ufw allow ssh
  - ufw allow 80/tcp
  - ufw allow 443/tcp
  - ufw --force enable

  # Create directories
  - mkdir -p /opt/ferry
  - mkdir -p /var/lib/ferry/data
  - mkdir -p /var/lib/ferry/bundles
  - mkdir -p /var/lib/ferry/outputs
  - mkdir -p /var/lib/ferry/releases
  - mkdir -p /var/log/ferry

  # Set ownership
  - chown -R ferry:ferry /opt/ferry
  - chown -R ferry:ferry /var/lib/ferry
  - chown -R ferry:ferry /var/log/ferry

  # Add ferry to docker group
  - usermod -aG docker ferry

  # Final status
  - echo "FERRY runtime ready — run install.sh as ferry user"
