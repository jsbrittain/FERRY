name: ferry

services:

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    volumes:
      - pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ferry}
      POSTGRES_USER: ${POSTGRES_USER:-ferry}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ferry}"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - internal

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:?}
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - internal

  # Ollama serves models to the platform over the internal network,
  # but also requires external network access to download models from
  # the Ollama registry. No other platform service requires Internet access.
  ollama:
    profiles:
      - ai
    image: ollama/ollama:latest
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s
    logging:
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - ollamadata:/root/.ollama
    networks:
      - internal
      - external

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c", "import http.client, json; c=http.client.HTTPConnection('localhost',8000,timeout=5); c.request('GET','/api/health'); r=c.getresponse(); assert r.status==200; assert json.loads(r.read())['status']=='ok'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    logging:
      options:
        max-size: "10m"
        max-file: "3"
    env_file:
      - .env
    environment:
      RESOURCE_MANIFEST_DIR: /resources
      ENVIRONMENT_MANIFEST_DIR: /execution-environments
      EXAMPLE_ANALYSIS_DIR: /examples/analyses
      TEMPLATE_DIR: /examples/templates
      OUTPUT_DIR: /outputs
      BUNDLE_STORE_DIR: /var/lib/ferry/bundles
    volumes:
      - /var/lib/ferry/outputs:/outputs:ro
      - /var/lib/ferry/bundles:/var/lib/ferry/bundles:rw
      - /var/lib/ferry/releases:/var/lib/ferry/releases
      - /var/log/ferry:/var/log/ferry
      - ./resources:/read-only-data:ro
      # Development manifest directories for lifespan auto-registration.
      # Production deployments should configure RESOURCE_MANIFEST_DIR
      # and ENVIRONMENT_MANIFEST_DIR env vars directly instead.
      - ./execution-environments:/execution-environments:ro
      - ./examples/analyses:/examples/analyses:ro
      - ./examples/templates:/examples/templates:ro
      - ./resources:/resources:ro
    networks:
      - internal
      - frontend

  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "worker.healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    logging:
      options:
        max-size: "10m"
        max-file: "3"
    env_file:
      - .env
    environment:
      # The worker runs in a container, so provider mount sources
      # like /read-only-data/* are not visible to Docker Engine
      # on the host. HOST_DATA_ROOT provides the host-side equivalent.
      HOST_DATA_ROOT: ${HOST_DATA_ROOT:-/opt/ferry/resources}
      # Persistent output store — writes imported execution artefacts
      # to the same volume the backend reads from.
      OUTPUT_DIR: /outputs
      ANALYSIS_BUNDLE_ROOT: /var/lib/ferry/bundles
      # Resource manifest directory — needed for representative dataset
      # resolution during validation runs.
      RESOURCE_MANIFEST_DIR: /resources
      # Host-side equivalent of RESOURCE_MANIFEST_DIR for Docker-outside-of-Docker
      # bind mounts during validation execution.
      HOST_RESOURCE_MANIFEST_DIR: ${HOST_RESOURCE_MANIFEST_DIR:-/opt/ferry/resources}
    volumes:
      # Docker socket enables DockerExecutor — the only component
      # that communicates with Docker Engine to orchestrate analysis containers.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/ferry/outputs:/outputs
      - /var/lib/ferry/bundles:/var/lib/ferry/bundles:ro
      - /var/log/ferry:/var/log/ferry
      - ./resources:/read-only-data:ro
      # Resource publications — required for representative dataset mounts
      # during validation runs. Reuses the same manifest directory the
      # backend reads from (RESOURCE_MANIFEST_DIR=/resources).
      - ./resources:/resources:ro
    networks:
      - internal
    group_add:
      - "${DOCKER_GID:?DOCKER_GID must be set — run bootstrap.sh or export DOCKER_GID=$(getent group docker | cut -d: -f3)}"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    logging:
      options:
        max-size: "10m"
        max-file: "3"
    env_file:
      - .env
    networks:
      - frontend

  reverse-proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      PUBLIC_URL_HOST: ${PUBLIC_URL_HOST:-localhost}
    volumes:
      - ./vm/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certs:/certs:ro
      - caddydata:/data
      - caddyconfig:/config
    depends_on:
      - frontend
      - backend
    networks:
      - frontend

volumes:
  pgdata:
  redisdata:
  ollamadata:
  caddydata:
  caddyconfig:

networks:
  internal:
    internal: true
  frontend:
  # Provides outbound Internet access for administrative tasks such as
  # pulling AI models. Only the Ollama service connects to this network.
  external:
